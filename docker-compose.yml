services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-techpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techpulse}
      POSTGRES_DB: ${POSTGRES_DB:-techpulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-techpulse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: build/api.Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-techpulse}:${POSTGRES_PASSWORD:-techpulse}@postgres:5432/${POSTGRES_DB:-techpulse}?sslmode=disable
      REDIS_ADDR: redis:6379
      API_PORT: "8080"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ingestion:
    build:
      context: .
      dockerfile: build/ingestion.Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-techpulse}:${POSTGRES_PASSWORD:-techpulse}@postgres:5432/${POSTGRES_DB:-techpulse}?sslmode=disable
      REDIS_ADDR: redis:6379
      INGESTION_INTERVAL: ${INGESTION_INTERVAL:-30m}
      INGESTION_FEEDS: /app/configs/feeds.json
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: build/web.Dockerfile
    environment:
      API_URL: http://api:8080
      WEB_PORT: "3000"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  pgdata:
